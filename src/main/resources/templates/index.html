<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Product Inventory System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <a class="navbar-brand" href="/products">Product Inventory System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/products"><i class="bi bi-table"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/products/new"><i class="bi bi-plus-circle"></i> Add
                        Product</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Dashboard </h3>
        <a href="/products/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add
            Product</a>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm rounded">
                <div class="card-body">
                    <form th:action="@{/products}" method="get" class="d-flex mb-3">
                        <input class="form-control me-2" type="search" placeholder="Search by name"
                               aria-label="Search" name="search" th:value="${search}"/>
                        <button class="btn btn-outline-secondary" type="submit"><i
                                class="bi bi-search"></i> Search
                        </button>
                    </form>

                    <div class="row">
                        <div th:if="${products == null or #lists.isEmpty(products)}" class="col-12">
                            <div class="alert alert-info text-center">No products available in inventory</div>
                        </div>
                        <div th:each="product : ${products}" class="col-lg-4 col-md-6 col-sm-12">
                            <div class="card shadow h-100 mb-4 p-3">
                                <div class="card-header bg-light">
                                    <h5 class="card-title mb-0">
                                        <i class="bi bi-box-seam me-1"></i>
                                        <span th:text="${product.name}"></span>
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <p class="card-text text-muted" th:text="${product.description}"></p>
                                    <p class="mb-1"><strong>Price:</strong> <span th:text="'₱' + ${product.price}"></span></p>
                                    <p><strong>Quantity:</strong> <span th:text="${product.quantity}"></span></p>
                                </div>
                                <div class="card-footer bg-transparent border-top-0">
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                       class="btn btn-sm btn-warning me-2"><i class="bi bi-pencil-square"></i>
                                        Edit</a>
                                    <a th:href="@{/products/delete/{id}(id=${product.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Are you sure?');"><i class="bi bi-trash-fill"></i>
                                        Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
