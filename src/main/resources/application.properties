spring.application.name=product_inventory

# H2 In-Memory Database Configuration (for testing without MySQL)
# To use MySQL instead, comment the H2 section below and uncomment the MySQL section
spring.datasource.url=jdbc:h2:mem:product_inventory_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Optional: accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Alternative MySQL Configuration (uncomment to use MySQL instead of H2)
# spring.datasource.url=jdbc:mysql://localhost:3306/product_inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
jwt.secret.key=mySecretKeyForJwtTokenGenerationThatIsLongEnoughToBeSecure123456789

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
